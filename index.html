<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a202c;
                --card-bg: #2d3748;
                --text-main: #edf2f7;
                --text-muted: #a0aec0;
                --accent: #63b3ed;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            margin-bottom: 20px;
        }
        h1 {
            margin: 10px 0 5px 0;
            font-size: 24px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px;
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--accent);
            color: var(--card-bg);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Замените URL картинки на свою (например, ссылку на ваше фото в GitHub) -->
        <img class="avatar" src="avatar.jpg" alt="Аватар">
        
        <h1>Timofey Tsvetkov</h1>
        <div class="subtitle">FEFU student (DevOps ingineer) </div>
        <div class="subtitle">Age: 18 y/o </div>
        
        <div class="links">
            <a href="https://t.me/alax0306" class="btn" target="_blank">Telegram</a>
            <a href="https://github.com" class="btn" target="_blank">GitHub</a>
            <a href="mailto:cvetkovt9@gmail.com" class="btn">Написать на почту</a>
            <a href="https://steamcommunity.com/profiles/76561198850448908/" class="btn" target="_blank">Steam</a>
        </div>
    </div>

</body>
</html>
